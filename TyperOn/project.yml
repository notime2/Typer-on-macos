name: TyperOn
options:
  bundleIdPrefix: com.typeron
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    PRODUCT_BUNDLE_IDENTIFIER: com.typeron.app
    PRODUCT_NAME: "Typer On"
    MARKETING_VERSION: "0.3.1"
    # Sparkle compares CFBundleVersion, so it follows the marketing version.
    CURRENT_PROJECT_VERSION: "$(MARKETING_VERSION)"
    INFOPLIST_FILE: Resources/Info.plist
    CODE_SIGN_ENTITLEMENTS: Resources/TyperOn.entitlements
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    COMBINE_HIDPI_IMAGES: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  TyperOn:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
      - path: Resources/Assets.xcassets
        buildPhase: resources
      # Sparkle is MIT-licensed; its license must ship with the binary.
      - path: Resources/Sparkle-LICENSE.txt
        buildPhase: resources
    dependencies:
      - package: Sparkle
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/TyperOn.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_APP_SANDBOX: NO
    # An explicit shared scheme is required: without one, xcodebuild autocreates a
    # scheme that injects code-coverage instrumentation into Release builds too.
    scheme:
      testTargets:
        - TyperOnTests
      gatherCoverageData: false
    info:
      path: Resources/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: "Typer On"
        CFBundleDisplayName: "Typer On"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "Copyright 2026 Maksim Nikolaev. Licensed under the Apache License, Version 2.0."
        NSAccessibilityUsageDescription: "Typer On needs accessibility access to detect selected text in other applications and replace it with AI-processed results."
        NSScreenCaptureUsageDescription: "Typer On uses screen capture only when you choose an area, window, or display to attach to Chat Mode."
        # Plain http is reachable for a user-configured local endpoint only; arbitrary loads stay disabled.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Sparkle: the release workflow attaches appcast.xml to every GitHub release.
        SUFeedURL: "https://github.com/notime2/Typer-on-macos/releases/latest/download/appcast.xml"
        SUPublicEDKey: "rJgmmyB9a1x+OzqzXim2iWJ/Ck6eNpj+r+XGS6ZAFlk="

  TyperOnTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        type: group
    dependencies:
      - target: TyperOn
    settings:
      base:
        PRODUCT_NAME: TyperOnTests
        SWIFT_MODULE_NAME: TyperOnTests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Typer On.app/Contents/MacOS/Typer On"
